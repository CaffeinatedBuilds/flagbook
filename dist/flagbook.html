    if (dups.length) html += `<div class="small" style="color:var(--red);margin-top:8px">⚠️ Same player in two spots in Q${dups.join(', Q')}</div>`;
    const anySet = Object.keys(rotation).some(q => Object.values(rotation[q]).some(Boolean));
    if (anySet && roster.length) {
      const counts = ROT.playCounts(rotation);
      const max = Math.max(...roster.map(p => counts[p.id] || 0)), min = Math.min(...roster.map(p => counts[p.id] || 0));
      html += `<div class="counts">${roster.map(p => `<span class="chip ${counts[p.id] === min && min !== max ? 'low' : counts[p.id] === max && min !== max ? 'high' : ''}">${U.esc(p.name)} · ${counts[p.id] || 0}</span>`).join('')}</div>`;
    }
    return html;
  }
  function bindRotationGrid(root, rotation) {
    root.querySelectorAll('select[data-q]').forEach(sel => sel.onchange = () => S.mutate(() => {
      rotation[sel.dataset.q] = rotation[sel.dataset.q] || {};
      rotation[sel.dataset.q][sel.dataset.pos] = sel.value;
    }));
  }
  function autoRotate(rotation, roster, Q, respectExisting, seed, history) {
    if (!roster.length) return U.toast('Add players to the roster first');
    const locked = {};
    if (respectExisting) for (const q of Object.keys(rotation)) { locked[q] = {}; for (const p of Object.keys(rotation[q])) if (rotation[q][p]) locked[q][p] = rotation[q][p]; }
    const res = ROT.build(roster.map(p => ({ id: p.id, positions: p.positions || [] })), { quarters: Q, locked, seed: seed == null ? 7 : seed, history: history || {} });
    S.mutate(() => { for (const k of Object.keys(rotation)) delete rotation[k]; Object.assign(rotation, res.rotation); });
    U.toast('Rotation built');
  }
  FB.rotationGrid = { html: rotationGridHTML, bind: bindRotationGrid, auto: autoRotate, spotHistory: id => spotHistory(id) };

  function shortOptions(roster, selectedId) {
    let s = '<option value="">—</option>';
    for (const p of roster) s += `<option value="${p.id}"${p.id === selectedId ? ' selected' : ''}>${U.esc((p.name || '').split(' ')[0] || ('#' + p.number))}</option>`;
    return s;
  }

  /* how often each player has played each spot in *other* games (for fairness across the season) */
  function spotHistory(exceptGameId) {
    const h = {};
    for (const g of S.get().games) {
      if (g.id === exceptGameId) continue;
      for (const q of Object.keys(g.rotation || {})) for (const [pos, id] of Object.entries(g.rotation[q])) if (id) { h[id] = h[id] || {}; h[id][pos] = (h[id][pos] || 0) + 1; }
    }
    return h;
  }

  function lineupPlay() {
    const players = {}; for (const k of Object.keys(S.FORMATIONS.Spread)) players[k] = S.FORMATIONS.Spread[k].slice();
    players.Q = [360, 450];
    return { players, routes: {}, spacing: { show: false, labels: {} } };
  }
  function namesFor(g, q) {
    const names = {}; const row = (g.rotation || {})[q] || {};
    for (const p of Object.keys(row)) if (row[p]) names[p] = (S.playerName(row[p]) || '').split(' ')[0];
    return names;
  }
  FB.views.game.namesFor = namesFor;

  /* ---------- printable game sheet ---------- */
  FB.views.gamesheet = {
    className: 'editor',
    render(root, route) {
      const g = S.game(route.id); if (!g) { root.innerHTML = '<div class="empty">Game not found</div>'; return; }
      const st = S.get(), Q = st.settings.quarters || 4, roster = S.activeRoster();
      FB.ui.setTitle(`<a class="btn ghost sm" href="#/games/${g.id}">‹ Back</a><h1>Game sheet</h1><button class="btn primary sm" id="print">🖨 Print / PDF</button>`);
      document.getElementById('print').onclick = () => window.print();
      let html = `<div class="gamesheet"><h1>${U.esc(st.team.name)}${g.opponent ? ' vs ' + U.esc(g.opponent) : ''}</h1>
        <div>${U.fmtDateLong(g.date)}${g.time ? ' · ' + U.fmtTime(g.time) : ''}${g.location ? ' · ' + U.esc(g.location) : ''}</div>
        <div style="margin:6px 0 14px">🍎 Snacks: <b>${g.snackPlayerId ? U.esc(S.snackLabel(g.snackPlayerId)) : '—'}</b></div>
        <table><thead><tr><th></th>${S.POSITIONS.map(p => `<th>${p}</th>`).join('')}<th>Sitting</th></tr></thead><tbody>`;
      for (let q = 1; q <= Q; q++) {
        const row = (g.rotation || {})[q] || {};
        const sit = ROT.sittingFor(g.rotation, q, roster.map(p => p.id)).map(id => S.playerName(id));
        html += `<tr><th>Q${q}</th>${S.POSITIONS.map(p => `<td>${row[p] ? U.esc(S.playerName(row[p])) : ''}</td>`).join('')}<td style="font-size:12px">${sit.map(U.esc).join(', ')}</td></tr>`;
      }
      html += `</tbody></table>${g.notes ? `<p>${U.esc(g.notes)}</p>` : ''}</div>`;
      root.innerHTML = html;
    }
  };
  FB.views.games.editGame = editGame;
})();

</script>
<script>
/* FlagBook — playbook list + play editor. */
(function () {
  'use strict';
  const FB = window.FB, U = FB.util, S = FB.store, G = FB.geo, F = FB.field;

  /* ---------- lineup bar: which players' names caption the tokens ---------- */
  function lineupBar(compact) {
    const st = S.get(), L = st.lineup, Q = st.settings.quarters || 4;
    const games = U.sortBy(st.games, 'date');
    const src = `<select id="lineupSrc" aria-label="Lineup source"><option value="off"${!L.show ? ' selected' : ''}>Names off</option><option value=""${L.show && !L.gameId ? ' selected' : ''}>Team lineup</option>${games.map(g => `<option value="${g.id}"${L.show && L.gameId === g.id ? ' selected' : ''}>${g.opponent ? 'vs ' + U.esc(g.opponent) : 'Game'} · ${U.fmtDate(g.date, { month: 'short', day: 'numeric' })}</option>`).join('')}</select>`;
    const qs = `<div class="seg qseg" id="lineupQ">${Array.from({ length: Q }, (_, i) => `<button data-q="${i + 1}" class="${L.quarter === i + 1 ? 'on' : ''}"${!L.show ? ' disabled' : ''}>Q${i + 1}</button>`).join('')}</div>`;
    const edit = `<button class="btn sm" id="lineupEdit"${!L.show ? ' disabled' : ''}>Edit lineup</button>`;
    return `<div class="lineup-bar${compact ? ' compact' : ''}">${src}${qs}${edit}</div>`;
  }
  function bindLineupBar(root) {
    const src = root.querySelector('#lineupSrc');
    if (src) src.onchange = e => {
      const v = e.target.value;
      if (v === 'off') S.setLineup({ show: false });
      else S.setLineup({ show: true, gameId: v });
    };
    root.querySelectorAll('#lineupQ button').forEach(b => b.onclick = () => S.setLineup({ quarter: +b.dataset.q }));
    const edit = root.querySelector('#lineupEdit');
    if (edit) edit.onclick = lineupEditor;
  }

  /* Edit the rotation behind the current lineup (team lineup or a game's) in a modal. */
  function lineupEditor() {
    const st = S.get(), L = st.lineup, Q = st.settings.quarters || 4;
    const roster = S.activeRoster();
    const g = L.gameId ? S.game(L.gameId) : null;
    const rotation = S.lineupRotation();
    if (!rotation) return;
    const title = g ? (g.opponent ? 'vs ' + g.opponent : 'Game') + ' lineup' : 'Team lineup';
    const m = FB.ui.modal('', { sticky: true, focus: false });
    const draw = () => {
      m.el.innerHTML = `<h2>${U.esc(title)}</h2>
        ${roster.length ? `<p class="hint" style="margin:0 0 10px">Who plays each spot in each quarter. The playbook shows these names under the tokens.${g ? '' : ' This is the team default; games can have their own rotation.'}</p>${FB.rotationGrid.html(rotation, roster, Q)}`
                        : '<div class="empty">Add players to the <a href="#/roster">roster</a> first.</div>'}
        <div class="actions" style="margin-top:14px">${roster.length ? '<button type="button" class="btn" id="auto">✨ Auto-fill</button><button type="button" class="btn" id="shuffle" title="Reshuffle">↻</button><button type="button" class="btn" id="clear">Clear</button>' : ''}<button type="button" class="btn primary" id="done">Done</button></div>`;
      FB.rotationGrid.bind(m.el, rotation);
      const q = sel => m.el.querySelector(sel);
      q('#done').onclick = m.close;
      if (q('#auto')) q('#auto').onclick = () => FB.rotationGrid.auto(rotation, roster, Q, true, 7, g ? FB.rotationGrid.spotHistory(g.id) : {});
      if (q('#shuffle')) q('#shuffle').onclick = () => FB.rotationGrid.auto(rotation, roster, Q, false, Math.floor(Math.random() * 1e6), g ? FB.rotationGrid.spotHistory(g.id) : {});
      if (q('#clear')) q('#clear').onclick = () => U.confirm('Clear this lineup?', { ok: 'Clear', danger: true }).then(ok => { if (ok) S.mutate(() => { for (const k of Object.keys(rotation)) delete rotation[k]; }); });
    };
    draw();
    // keep the modal in sync while the store changes underneath it (grid edits re-render the page)
    const unsub = S.subscribe(() => { if (document.body.contains(m.bg)) draw(); else unsub(); });
  }

  /* ---------- list ---------- */
  function newPlayDialog() {
    const m = FB.ui.modal(`<h2>New play</h2><form id="f">
      <div class="field-row"><label>Name</label><input type="text" name="name" placeholder="e.g. Trips Right – Y Corner" required autocomplete="off"></div>
      <div class="field-row"><label>Starting formation</label><select name="formation">${Object.keys(S.FORMATIONS).map(k => `<option>${k}</option>`).join('')}<option value="__empty">Empty field</option></select></div>
      <div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn primary">Create</button></div></form>`);
    m.el.querySelector('#cancel').onclick = m.close;
    m.el.querySelector('#f').onsubmit = e => {
      e.preventDefault();
      const d = FB.ui.formData(e.target);
      const p = S.newPlay(d.name, d.formation);
      if (d.formation === '__empty') S.mutate(() => { p.players = {}; });
      m.close();
      location.hash = '#/playbook/' + p.id;
    };
  }

  function renderList(root, route) {
    const st = S.get();
    const names = S.lineupNames();
    FB.ui.setTitle(`<h1>Playbook</h1><a class="btn sm" href="#/print">🖨</a><button class="btn primary sm" id="add">+ New play</button>`);
    document.getElementById('add').onclick = newPlayDialog;
    let html = lineupBar(false);
    if (names && !Object.keys(names).length) html += `<p class="hint" style="margin:0 0 12px">No players assigned for ${U.esc(S.lineupLabel())} yet. Tap <b>Edit lineup</b> to fill the quarters.</p>`;
    const subbed = names ? S.subbedPositions() : [];
    if (subbed.length) {
      const row = S.lineupRow(), base = S.lineupBaseRow();
      const desc = subbed.map(pos => `<b>${pos}</b>: ${row[pos] ? U.esc(S.playerName(row[pos]).split(' ')[0]) : 'empty'}${base[pos] ? ' for ' + U.esc(S.playerName(base[pos]).split(' ')[0]) : ''}`).join(', ');
      html += `<p class="hint subs-note" style="margin:0 0 12px">🔁 Subs in ${U.esc(S.lineupLabel())} — ${desc}. <button type="button" class="btn sm" id="clearSubs">Undo subs</button></p>`;
    }
    if (!st.plays.length) html += `<div class="empty">No plays yet.<br><br><button class="btn primary" id="add2">Create your first play</button></div>`;
    else html += `<div class="plays">${st.plays.map(p => `<a class="play-card" href="#/view/${p.id}">${F.svgString(p, { names })}<div class="cap"><span>${U.esc(p.name)}</span>${Object.values(p.routes).some(r => r.hot) ? '<i class="dot" title="has hot route"></i>' : ''}</div></a>`).join('')}</div>`;
    root.innerHTML = html;
    bindLineupBar(root);
    const cs = root.querySelector('#clearSubs'); if (cs) cs.onclick = () => S.clearSubs();
    const a2 = root.querySelector('#add2'); if (a2) a2.onclick = newPlayDialog;
  }

  /* ---------- editor ---------- */
  const ed = { id: null, sel: null, mode: 'move', showGrid: false, stroke: null, drag: null, dragLabel: null, svg: null, play: null, names: null, zoom: null /* [x,y,w,h] viewBox when pinched in */ };

  function renderEditor(root, route) {
    const play = S.play(route.id);
    if (!play) { root.innerHTML = '<div class="empty">Play not found. <a href="#/playbook">Back to playbook</a></div>'; return; }
    // every play opens in Move: drawing a route is an explicit opt-in so a stray drag never rewrites one
    if (ed.id !== play.id) { ed.id = play.id; ed.sel = null; ed.stroke = null; ed.drag = null; ed.dragLabel = null; ed.mode = 'move'; ed.zoom = null; }
    ed.play = play; ed.names = S.lineupNames();
    if (ed.sel && !play.players[ed.sel]) ed.sel = null;
    const scrollY = window.scrollY;

    FB.ui.setTitle(`<a class="btn ghost sm" href="#/playbook" aria-label="Back">‹</a>
      <input class="play-name" id="pname" value="${U.esc(play.name)}" aria-label="Play name">
      <a class="btn sm" href="#/view/${play.id}" title="View mode: present and annotate without changing the play">👁 View</a>
      <button class="btn sm icon" id="menu" aria-label="More">⋯</button>`);
    document.getElementById('pname').onchange = e => S.mutate(() => { play.name = e.target.value.trim() || 'Untitled'; play.updatedAt = Date.now(); });
    document.getElementById('menu').onclick = () => playMenu(play, route);

    const sel = ed.sel, r = sel ? play.routes[sel] : null;
    const onField = pos => !!play.players[pos];
    const tokBtn = pos => { const m = S.POSITION_META[pos]; return `<button class="tok ${m.shape}${onField(pos) ? ' onfield' : ''}${sel === pos ? ' sel' : ''}" data-bench="${pos}" style="background:${m.fill};${pos === 'Z' ? 'color:#5b4a00' : ''}" title="${m.name}"><span>${pos}</span></button>`; };

    let html = `<div class="field-wrap"><svg class="field ${ed.mode}" id="field" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="editor-body">
      <div class="full">${lineupBar(true)}</div>
      <div class="toolrow full">
        <div class="seg" id="mode"><button data-mode="move" class="${ed.mode === 'move' ? 'on' : ''}">✋ Move</button><button data-mode="draw" class="${ed.mode === 'draw' ? 'on' : ''}">✏️ Draw route</button></div>
        <button class="btn sm${ed.zoom ? '' : ' hidden'}" id="zoomReset" title="Show the whole field again (pinch with two fingers to zoom)">⤢ Whole field</button>
        <div class="bench" id="bench">${S.POSITIONS.map(tokBtn).join('')}</div>
        <span class="hint grow">${ed.mode === 'draw' ? (sel ? `Drag on the field to draw <b>${sel}</b>'s route.` : 'Tap a player, then drag to draw their route.') : 'Drag players to position them. Drag from the bench to add.'}</span>
      </div>`;

    if (sel) {
      const m = S.POSITION_META[sel];
      const hasRoute = r && r.pts && r.pts.length > 1;
      html += `<div class="card route-panel">
        <div class="head"><span class="tokdot" style="background:${m.fill};${sel === 'Z' ? 'color:#5b4a00' : ''}">${sel}</span><b>${m.name}</b>${ed.names && ed.names[sel] ? `<span class="muted">· ${U.esc(ed.names[sel])}</span>` : ''}<span class="grow"></span><button class="btn sm ghost danger" id="removeP">Remove from field</button></div>
        ${hasRoute ? `
        <div class="toolrow" style="margin-bottom:10px">
          <button class="btn hot ${r.hot ? 'on' : ''}" id="hot">🔥 Hot route</button>
          <div class="row" style="gap:6px"><span class="small muted">Ready on step</span>
            <div class="stepper"><button id="stepDn">−</button><span class="val ${r.hot ? 'red' : ''}" id="stepVal">${r.steps == null ? '<span class="muted small">off</span>' : r.steps}</span><button id="stepUp">+</button></div>
            ${r.steps != null ? '<button class="btn sm ghost" id="stepClr">clear</button>' : ''}</div>
        </div>
        <div class="toolrow">
          <span class="small muted">Ending</span>
          <div class="seg" id="ending">${[['arrow', '➔'], ['dot', '●'], ['block', '⊥'], ['none', '—']].map(([k, l]) => `<button data-end="${k}" class="${(r.end || 'arrow') === k ? 'on' : ''}" title="${k}">${l}</button>`).join('')}</div>
          <button class="btn sm ${r.dashed ? 'on' : ''}" id="dashed">Dashed</button>
          <button class="btn sm" id="flip" title="${r.labelAt ? 'Snap the step number back beside the route' : 'Move the step number to the other side'}">${r.labelAt ? '↺ #' : '⇄ #'}</button>
          <button class="btn sm danger" id="clearRoute">Clear route</button>
        </div>
        <p class="hint" style="margin:10px 0 0">Tip: tap a route on the field to select it; tap it again to toggle hot. Drag the step number to place it where you want. Redraw any time — the route keeps its settings.</p>` :
        `<p class="hint" style="margin:0">No route yet. Switch to <b>Draw route</b> and drag from ${sel} across the field. Sharp cuts stay sharp, curves get smoothed.</p>`}
      </div>`;
    }

    html += `<div class="card">
      <div class="toolrow">
        <label class="switch"><input type="checkbox" id="spacing"${play.spacing.show ? ' checked' : ''}> Show spacing (yds)</label>
        <label class="switch"><input type="checkbox" id="grid"${ed.showGrid ? ' checked' : ''}> Yard grid</label>
        <select id="formation" style="width:auto;min-height:38px;padding:6px 10px"><option value="">Apply formation…</option>${Object.keys(S.FORMATIONS).map(k => `<option>${k}</option>`).join('')}</select>
      </div>
      ${play.spacing.show ? '<p class="hint" style="margin:8px 0 0">Spacing is measured in yards from the player positions. Tap a red number on the field to type your own.</p>' : ''}
      <div class="field-row" style="margin:12px 0 0"><label>Coaching notes</label><textarea id="notes" placeholder="Who's the first read? Snap count? Motion?">${U.esc(play.notes)}</textarea></div>
    </div></div>`;
    root.innerHTML = html;

    ed.svg = root.querySelector('#field');
    drawField();
    bindEditor(root, play, route);
    bindLineupBar(root);
    window.scrollTo(0, scrollY);
  }

  function drawField(live) {
    if (!ed.svg || !ed.play) return;
    F.render(ed.svg, ed.play, { selected: ed.sel, showGrid: ed.showGrid, names: ed.names, interactive: true, liveStroke: live, viewBox: ed.zoom ? ed.zoom.join(' ') : null });
  }

  function save(fn) { S.mutate(() => { fn(); ed.play.updatedAt = Date.now(); }); }

  function tokenAt(play, x, y) {
    let best = null, bd = Infinity;
    for (const pos of Object.keys(play.players)) {
      const d = Math.hypot(play.players[pos][0] - x, play.players[pos][1] - y);
      if (d < G.TOKEN_R + 10 && d < bd) { bd = d; best = pos; }
    }
    return best;
  }
  function routeAt(play, x, y) {
    let best = null, bd = 14;
    for (const pos of Object.keys(play.routes)) {
      const r = play.routes[pos]; if (!play.players[pos] || !r.pts || r.pts.length < 2) continue;
      const d = G.distanceToRoute(r, play.players[pos][0], play.players[pos][1], x, y);
      if (d < bd) { bd = d; best = pos; }
    }
    return best;
  }

  function bindEditor(root, play, route) {
    const svg = ed.svg;
    // mode
    root.querySelectorAll('#mode button').forEach(b => b.onclick = () => { ed.mode = b.dataset.mode; FB.app.rerender(); });

    // bench: tap to place, drag to drop
    root.querySelectorAll('[data-bench]').forEach(btn => {
      const pos = btn.dataset.bench;
      let ghost = null, start = null;
      btn.onpointerdown = e => {
        e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (err) {}
        start = [e.clientX, e.clientY];
      };
      btn.onpointermove = e => {
        if (!start) return;
        if (!ghost && Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 8) {
          ghost = document.createElement('div'); ghost.className = 'ghost-tok'; ghost.textContent = pos;
          ghost.style.background = S.POSITION_META[pos].fill; document.body.appendChild(ghost);
        }
        if (ghost) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; }
      };
      const finish = e => {
        if (!start) return;
        const wasDrag = !!ghost;
        if (ghost) { ghost.remove(); ghost = null; }
        start = null;
        const rect = svg.getBoundingClientRect();
        if (wasDrag) {
          if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
            const [x, y] = F.pointFromEvent(svg, e);
            save(() => { play.players[pos] = [Math.round(U.clamp(x, 10, G.FIELD_W - 10)), Math.round(U.clamp(y, 10, G.FIELD_H - 10))]; });
            ed.sel = pos;
          }
        } else {
          // tap: select if on field, else place at default spot
          if (play.players[pos]) { ed.sel = ed.sel === pos ? null : pos; FB.app.rerender(); }
          else { save(() => { play.players[pos] = S.DEFAULT_SPOTS[pos].slice(); }); ed.sel = pos; }
        }
      };
      btn.onpointerup = finish; btn.onpointercancel = finish;
    });

    // field interactions
    let downPt = null, moved = false, tapRoute = null, tapGap = null;

    // Two fingers = pinch: zoom and pan the field. Whatever the first finger had started (a stroke,
    // a token or step-number drag) is thrown away, so a pinch can never draw or move anything.
    const pointers = new Map();
    let pinch = null, pinchEnded = false;
    const WHOLE = [0, 0, G.FIELD_W, G.FIELD_H];
    function startPinch() {
      if (ed.drag) { if (ed.drag.from) play.players[ed.drag.pos] = ed.drag.from; ed.drag = null; }
      if (ed.dragLabel) { const r = play.routes[ed.dragLabel.pos]; if (r) { if (ed.dragLabel.from) r.labelAt = ed.dragLabel.from; else delete r.labelAt; } ed.dragLabel = null; }
      ed.stroke = null; downPt = null; tapRoute = null; tapGap = null; moved = false; pinchEnded = false;
      drawField();
      const [a, b] = Array.from(pointers.values());
      const rect = svg.getBoundingClientRect(), box = ed.zoom || WHOLE;
      const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      pinch = {
        d0: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, z0: G.FIELD_W / box[2],
        anchor: [box[0] + (mid[0] - rect.left) / rect.width * box[2], box[1] + (mid[1] - rect.top) / rect.height * box[3]]   // field point under the fingers
      };
    }
    function movePinch() {
      if (pointers.size < 2) return;
      const [a, b] = Array.from(pointers.values());
      const rect = svg.getBoundingClientRect();
      const z = U.clamp(pinch.z0 * (Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d0), 1, 4);
      const w = G.FIELD_W / z, h = G.FIELD_H / z;
      const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const x = U.clamp(pinch.anchor[0] - (mid[0] - rect.left) / rect.width * w, 0, G.FIELD_W - w);
      const y = U.clamp(pinch.anchor[1] - (mid[1] - rect.top) / rect.height * h, 0, G.FIELD_H - h);
      ed.zoom = z > 1.01 ? [x, y, w, h].map(v => Math.round(v * 10) / 10) : null;
      svg.setAttribute('viewBox', (ed.zoom || WHOLE).join(' '));
    }
    const syncZoomUI = () => { const b = root.querySelector('#zoomReset'); if (b) b.classList.toggle('hidden', !ed.zoom); };
    const zoomReset = root.querySelector('#zoomReset'); if (zoomReset) zoomReset.onclick = () => { ed.zoom = null; drawField(); syncZoomUI(); };

    svg.onpointerdown = e => {
      if (e.button != null && e.button !== 0) return;
      e.preventDefault();
      pointers.set(e.pointerId, [e.clientX, e.clientY]);
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      if (pointers.size >= 2 && !pinch) startPinch();
      if (pinch || pinchEnded) return;
      const [x, y] = F.pointFromEvent(svg, e);
      downPt = [x, y]; moved = false; tapRoute = null; tapGap = null;
      const gapEl = e.target.closest && e.target.closest('.gap');
      if (gapEl) { tapGap = gapEl.dataset.gap; return; }
      const lblEl = e.target.closest && e.target.closest('.steplabel');
      if (lblEl && play.routes[lblEl.dataset.pos]) {
        // grab the step number: works in either mode and takes priority over drawing
        const pos = lblEl.dataset.pos, r = play.routes[pos], at = play.players[pos];
        const cur = r.labelAt ? [at[0] + r.labelAt[0], at[1] + r.labelAt[1]] : G.labelPoint(r, at[0], at[1], r.labelSide || 1, 22);
        ed.dragLabel = { pos, dx: cur[0] - x, dy: cur[1] - y, from: r.labelAt ? r.labelAt.slice() : null };
        if (ed.sel !== pos) { ed.sel = pos; drawField(); }
        return;
      }
      const tok = tokenAt(play, x, y);
      if (ed.mode === 'move') {
        if (tok) { ed.sel = tok; ed.drag = { pos: tok, dx: play.players[tok][0] - x, dy: play.players[tok][1] - y, from: play.players[tok].slice() }; drawField(); }
        else tapRoute = routeAt(play, x, y);
      } else {
        const target = tok || ed.sel;
        if (!target) { tapRoute = routeAt(play, x, y); if (!tapRoute) U.toast('Tap a player first'); return; }
        if (tok && tok !== ed.sel) { ed.sel = tok; drawField(); }
        // Pressing on a route (not a token): another player's route selects it; your own
        // route toggles hot on a plain tap. Either way a drag still draws for the target.
        if (!tok) { const rp = routeAt(play, x, y); if (rp) { tapRoute = rp; if (rp !== ed.sel) return; } }
        ed.stroke = [play.players[target].slice()];
      }
    };
    svg.onpointermove = e => {
      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.clientX, e.clientY]);
      if (pinch) { movePinch(); return; }
      if (pinchEnded || !downPt) return;
      const [x, y] = F.pointFromEvent(svg, e);
      if (!moved && Math.hypot(x - downPt[0], y - downPt[1]) > 3) moved = true;
      if (ed.dragLabel) {
        const at = play.players[ed.dragLabel.pos];
        play.routes[ed.dragLabel.pos].labelAt = [U.clamp(x + ed.dragLabel.dx, 12, G.FIELD_W - 12) - at[0], U.clamp(y + ed.dragLabel.dy, 14, G.FIELD_H - 14) - at[1]];
        drawField();
      } else if (ed.drag) {
        play.players[ed.drag.pos] = [U.clamp(x + ed.drag.dx, 10, G.FIELD_W - 10), U.clamp(y + ed.drag.dy, 10, G.FIELD_H - 10)];
        drawField();
      } else if (ed.stroke) {
        const last = ed.stroke[ed.stroke.length - 1];
        if (Math.hypot(x - last[0], y - last[1]) > 1.5) { ed.stroke.push([U.clamp(x, 0, G.FIELD_W), U.clamp(y, 0, G.FIELD_H)]); drawField(ed.stroke); }
      }
    };
    const up = e => {
      pointers.delete(e.pointerId);
      if (pinch) { if (pointers.size < 2) { pinch = null; pinchEnded = pointers.size > 0; syncZoomUI(); } return; }   // the finger still down must not start drawing
      if (pinchEnded) { if (!pointers.size) pinchEnded = false; return; }
      if (!downPt) return;
      const wasDown = downPt; downPt = null;
      if (tapGap && !moved) {
        const cur = (play.spacing.labels || {})[tapGap] || '';
        const v = prompt('Spacing label (yards) for this gap. Leave blank to auto-measure.', cur);
        if (v !== null) save(() => { play.spacing.labels = play.spacing.labels || {}; if (v.trim()) play.spacing.labels[tapGap] = v.trim(); else delete play.spacing.labels[tapGap]; });
        tapGap = null; return;
      }
      if (ed.dragLabel) {
        const pos = ed.dragLabel.pos; ed.dragLabel = null;
        const r = play.routes[pos];
        if (moved && r.labelAt) { r.labelAt = [Math.round(r.labelAt[0]), Math.round(r.labelAt[1])]; save(() => {}); }
        else FB.app.rerender();
        return;
      }
      if (ed.drag) {
        const pos = ed.drag.pos; ed.drag = null;
        // snap onto the line of scrimmage if close
        const p = play.players[pos];
        if (Math.abs(p[1] - G.RECEIVER_Y) < 12) p[1] = G.RECEIVER_Y;
        p[0] = Math.round(p[0]); p[1] = Math.round(p[1]);
        save(() => {});
        return;
      }
      if (ed.stroke) {
        const stroke = ed.stroke; ed.stroke = null;
        const target = ed.sel;
        if (moved && stroke.length > 2) {
          const r = G.processStroke(stroke);
          if (r) {
            save(() => {
              const prev = play.routes[target] || {};
              play.routes[target] = Object.assign({ hot: false, steps: null, end: 'arrow', dashed: false, labelSide: 1 }, prev, r);
              // put the number on the side away from the field edge
              if (!prev.pts) play.routes[target].labelSide = play.players[target][0] > G.FIELD_W - 90 ? -1 : 1;
            });
            return;
          }
        }
        // tiny stroke = a tap: fall through to route-tap handling, else just refresh
        if (!tapRoute) { FB.app.rerender(); return; }
      }
      if (tapRoute && !moved) {
        if (ed.sel === tapRoute) save(() => { play.routes[tapRoute].hot = !play.routes[tapRoute].hot; if (play.routes[tapRoute].hot && play.routes[tapRoute].steps == null) play.routes[tapRoute].steps = 3; });
        else { ed.sel = tapRoute; FB.app.rerender(); }
        return;
      }
      if (!moved && ed.mode === 'move' && !tokenAt(play, wasDown[0], wasDown[1])) { if (ed.sel) { ed.sel = null; FB.app.rerender(); } }
    };
    svg.onpointerup = up; svg.onpointercancel = up;

    // route panel
    const q = s => root.querySelector(s);
    const r = ed.sel ? play.routes[ed.sel] : null;
    if (q('#removeP')) q('#removeP').onclick = () => { const pos = ed.sel; ed.sel = null; save(() => { delete play.players[pos]; delete play.routes[pos]; }); };
    if (r) {
      if (q('#hot')) q('#hot').onclick = () => save(() => { r.hot = !r.hot; if (r.hot && r.steps == null) r.steps = 3; });
      if (q('#stepUp')) q('#stepUp').onclick = () => save(() => { r.steps = r.steps == null ? 1 : Math.min(15, r.steps + 1); });
      if (q('#stepDn')) q('#stepDn').onclick = () => save(() => { r.steps = r.steps == null ? 1 : Math.max(1, r.steps - 1); });
      if (q('#stepClr')) q('#stepClr').onclick = () => save(() => { r.steps = null; });
      root.querySelectorAll('#ending button').forEach(b => b.onclick = () => save(() => { r.end = b.dataset.end; }));
      if (q('#dashed')) q('#dashed').onclick = () => save(() => { r.dashed = !r.dashed; });
      if (q('#flip')) q('#flip').onclick = () => save(() => { if (r.labelAt) delete r.labelAt; else r.labelSide = (r.labelSide || 1) * -1; });
      if (q('#clearRoute')) q('#clearRoute').onclick = () => save(() => { delete play.routes[ed.sel]; });
    }
    q('#spacing').onchange = e => save(() => { play.spacing.show = e.target.checked; });
    q('#grid').onchange = e => { ed.showGrid = e.target.checked; drawField(); };
    q('#formation').onchange = e => {
      const f = S.FORMATIONS[e.target.value]; if (!f) return;
      save(() => { for (const pos of Object.keys(f)) play.players[pos] = f[pos].slice(); });
    };
    q('#notes').onchange = e => save(() => { play.notes = e.target.value; });
  }

  function playMenu(play, route) {
    const m = FB.ui.modal(`<h2>${U.esc(play.name)}</h2><div class="stack">
      <a class="btn" href="#/print/${play.id}">🖨 Print this play</a>
      <button class="btn" id="dup">Duplicate</button>
      <button class="btn" id="up">Move up in playbook</button>
      <button class="btn" id="down">Move down in playbook</button>
      <button class="btn" id="clearAll">Clear all routes</button>
      <button class="btn danger" id="del">Delete play</button>
      <button class="btn ghost" id="cancel">Cancel</button></div>`);
    const q = s => m.el.querySelector(s);
    q('#cancel').onclick = m.close;
    q('a.btn').onclick = m.close;
    q('#dup').onclick = () => { const c = S.duplicatePlay(play.id); m.close(); location.hash = '#/playbook/' + c.id; };
    const move = dir => { S.mutate(st => { const i = st.plays.indexOf(play), j = i + dir; if (j < 0 || j >= st.plays.length) return; st.plays.splice(i, 1); st.plays.splice(j, 0, play); }); m.close(); U.toast('Moved'); };
    q('#up').onclick = () => move(-1); q('#down').onclick = () => move(1);
    q('#clearAll').onclick = () => U.confirm('Clear all routes on this play?', { ok: 'Clear', danger: true }).then(ok => { if (ok) { S.mutate(() => { play.routes = {}; }); m.close(); } });
    q('#del').onclick = () => U.confirm('Delete "' + play.name + '"?', { ok: 'Delete', danger: true }).then(ok => { if (ok) { S.mutate(st => { st.plays = st.plays.filter(p => p.id !== play.id); }); m.close(); location.hash = '#/playbook'; } });
  }

  FB.views.playbook = {
    get className() { return FB.app && FB.app.route() && FB.app.route().id ? 'editor' : ''; },
    render(root, route) { if (route.id) renderEditor(root, route); else renderList(root, route); },
    destroy() { ed.id = null; ed.sel = null; ed.stroke = null; ed.drag = null; }
  };
})();

</script>
<script>
/* FlagBook — View mode: show a play full-size and scribble over it without changing it.
 * Annotations are kept in memory only and reset when the play changes. */
(function () {
  'use strict';
  const FB = window.FB, U = FB.util, S = FB.store, G = FB.geo, F = FB.field;

  const PENS = [
    { id: 'yellow', color: '#F5C400', width: 12, opacity: 0.55, label: 'Highlighter' },
    { id: 'red',    color: '#E5352B', width: 5,  opacity: 1,    label: 'Red pen' },
    { id: 'blue',   color: '#2A7DE1', width: 5,  opacity: 1,    label: 'Blue pen' },
    { id: 'black',  color: '#111111', width: 5,  opacity: 1,    label: 'Black pen' }
  ];
  const A = { playId: null, strokes: [], pen: 'red', live: null };

  function resetFor(playId) { if (A.playId !== playId) { A.playId = playId; A.strokes = []; A.live = null; } }
  function pen() { return PENS.find(p => p.id === A.pen) || PENS[1]; }
  const f = n => Math.round(n * 10) / 10;

  function strokeMarkup(s) {
    if (s.pts.length === 1) { const p = s.pts[0]; return `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${s.width / 2}" fill="${s.color}" opacity="${s.opacity}" />`; }
    return `<polyline points="${s.pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.width}" stroke-opacity="${s.opacity}" stroke-linecap="round" stroke-linejoin="round" />`;
  }
  function drawAnnots(svg) { svg.innerHTML = A.strokes.map(strokeMarkup).join(''); }

  /* ---------- substitutions: swap a bench kid into a spot without leaving the play ---------- */
  function playerLabel(p) { return (p.number ? '#' + U.esc(p.number) + ' ' : '') + U.esc(p.name); }
  function spotLine(pos, row) {
    const id = row[pos], p = id ? S.player(id) : null;
    return `${FB.ui.posChip(pos)}<span class="who">${p ? playerLabel(p) : '<span class="muted">nobody</span>'}</span>`;
  }

  /* Step 1 (from the 🔁 button): which spot is changing? */
  function subSheet(play) {
    if (!S.get().lineup.show) { U.toast('Turn names on in the playbook to make substitutions'); return; }
    const row = S.lineupRow(), positions = Object.keys(play.players);
    const subbed = S.subbedPositions();
    const m = FB.ui.modal(`<h2>Substitution</h2><p class="hint" style="margin:0 0 10px">${U.esc(S.lineupLabel())} · who is coming out?</p>
      <div class="sublist">${positions.map(pos => `<button type="button" class="subrow" data-pos="${pos}">${spotLine(pos, row)}<span class="go">›</span></button>`).join('')}</div>
      <div class="actions">${subbed.length ? '<button type="button" class="btn" id="resetSubs">Undo all subs</button>' : ''}<button type="button" class="btn" id="cancel">Cancel</button></div>`, { focus: false });
    m.el.querySelectorAll('[data-pos]').forEach(b => b.onclick = () => { m.close(); pickSheet(play, b.dataset.pos); });
    m.el.querySelector('#cancel').onclick = m.close;
    const r = m.el.querySelector('#resetSubs'); if (r) r.onclick = () => { m.close(); S.clearSubs(); U.toast('Back to the lineup'); };
  }

  /* Step 2 (also reached by tapping a token): who goes in at this spot? */
  function pickSheet(play, pos) {
    if (!S.get().lineup.show) { U.toast('Turn names on in the playbook to make substitutions'); return; }
    const row = S.lineupRow(), base = S.lineupBaseRow();
    const cur = row[pos] ? S.player(row[pos]) : null;
    const bench = S.benchPlayers();
    const onField = Object.keys(play.players).filter(o => o !== pos && row[o]);
    const isSub = S.subbedPositions().indexOf(pos) >= 0, orig = base[pos] ? S.player(base[pos]) : null;
    const m = FB.ui.modal(`<h2>${FB.ui.posChip(pos)} ${cur ? U.esc(cur.name) : 'Open spot'}</h2>
      <p class="hint" style="margin:0 0 10px">${cur ? 'Who goes in for ' + U.esc(cur.name.split(' ')[0]) + '?' : 'Who takes this spot?'}</p>
      ${isSub ? `<button type="button" class="subrow undo" id="revert">↩ Put ${orig ? U.esc(orig.name) : 'the lineup'} back${orig ? '' : ' (leave empty)'}</button>` : ''}
      ${bench.length ? `<div class="subhead">Bench</div><div class="sublist">${bench.map(p => `<button type="button" class="subrow" data-in="${p.id}"><span class="who">${playerLabel(p)}</span><span class="go">In</span></button>`).join('')}</div>` : '<p class="hint">Nobody on the bench right now.</p>'}
      ${onField.length ? `<div class="subhead">Trade spots with</div><div class="sublist">${onField.map(o => `<button type="button" class="subrow" data-swap="${o}">${spotLine(o, row)}<span class="go">⇄</span></button>`).join('')}</div>` : ''}
      <div class="actions">${cur ? '<button type="button" class="btn" id="empty">Nobody (leave empty)</button>' : ''}<button type="button" class="btn" id="cancel">Cancel</button></div>`, { focus: false });
    const done = msg => { m.close(); if (msg) U.toast(msg); };
    m.el.querySelectorAll('[data-in]').forEach(b => b.onclick = () => { const p = S.player(b.dataset.in); S.setSub(pos, b.dataset.in); done(`${p ? p.name.split(' ')[0] : 'Sub'} in at ${pos}${cur ? ' for ' + cur.name.split(' ')[0] : ''}`); });
    m.el.querySelectorAll('[data-swap]').forEach(b => b.onclick = () => { S.swapSpots(pos, b.dataset.swap); done(`${pos} and ${b.dataset.swap} traded spots`); });
    const rv = m.el.querySelector('#revert'); if (rv) rv.onclick = () => { S.setSub(pos, base[pos] || ''); done('Back to the lineup at ' + pos); };
    const em = m.el.querySelector('#empty'); if (em) em.onclick = () => { S.setSub(pos, ''); done(pos + ' is empty'); };
    m.el.querySelector('#cancel').onclick = m.close;
  }

  /* Which token (if any) is under a field-coordinate point. */
  function tokenAt(play, x, y) {
    const R = G.TOKEN_R + 10;
    let best = null, bd = Infinity;
    for (const pos of Object.keys(play.players)) {
      const [tx, ty] = play.players[pos], d = Math.hypot(tx - x, ty - y);
      if (d < R && d < bd) { best = pos; bd = d; }
    }
    return best;
  }

  FB.views.viewer = {
    className: 'editor viewer-page',
    render(root, route) {
      const st = S.get();
      const plays = st.plays;
      const idx = plays.findIndex(p => p.id === route.id);
      const play = plays[idx];
      if (!play) { root.innerHTML = '<div class="empty">Play not found. <a href="#/playbook">Back to playbook</a></div>'; return; }
      resetFor(play.id);
      document.body.classList.add('viewing');
      const prev = plays[(idx - 1 + plays.length) % plays.length], next = plays[(idx + 1) % plays.length];
      const L = st.lineup, Q = st.settings.quarters || 4;
      const names = S.lineupNames();
      const subbed = L.show ? S.subbedPositions() : [];
      const crop = F.contentCrop(play, { names });   // trim empty sky so the play can go wide

      FB.ui.setTitle(`<a class="btn ghost sm" href="#/playbook" aria-label="Back to playbook">‹</a>
        <h1 style="font-size:18px">${U.esc(play.name)}</h1>
        <span class="muted small">${idx + 1}/${plays.length}</span>
        <a class="btn sm" href="#/playbook/${play.id}" title="Edit this play">✏️ Edit</a>`);

      root.innerHTML = `
        <div class="viewer${play.notes ? ' has-notes' : ''}">
          <div class="stage">
            <div class="canvas" id="canvas">
              <div class="frame" style="--ar:${crop.ratio.toFixed(4)}">
                <svg class="field" id="vfield" xmlns="http://www.w3.org/2000/svg"></svg>
              </div>
              <svg class="annot" id="annot" xmlns="http://www.w3.org/2000/svg" viewBox="${crop.viewBox}"></svg>
            </div>
          <div class="vtools">
            <div class="vgroup nav-plays">
              <button class="btn icon" id="prevPlay" title="Previous play: ${U.esc(prev.name)}">‹</button>
              <button class="btn icon" id="nextPlay" title="Next play: ${U.esc(next.name)}">›</button>
            </div>
            <div class="vgroup pens">
              ${PENS.map(p => `<button class="pen${A.pen === p.id ? ' on' : ''}" data-pen="${p.id}" title="${p.label}" style="--pen:${p.color}"></button>`).join('')}
              <button class="btn icon" id="undo" title="Undo last mark">↶</button>
              <button class="btn icon" id="clear" title="Clear marks">✕</button>
            </div>
            <div class="vgroup">
              <button class="btn icon" id="recBtn" title="Record a clip of this play (you come back to the playbook when you stop)">🎥</button>
              <input type="file" accept="video/*" capture="environment" id="recIn" class="hidden" aria-hidden="true" tabindex="-1">
            </div>
            ${L.show ? `<div class="vgroup seg qseg small-seg">${Array.from({ length: Q }, (_, i) => `<button data-q="${i + 1}" class="${L.quarter === i + 1 ? 'on' : ''}">Q${i + 1}</button>`).join('')}</div>
            <div class="vgroup"><button class="btn icon${subbed.length ? ' on' : ''}" id="subBtn" title="Substitution: swap a player in from the bench (or tap a player on the field)">🔁</button></div>` : ''}
          </div>
          ${play.notes ? `<div class="vnotes" title="Tap for the full notes">${U.esc(play.notes)}</div>` : ''}
          </div>
        </div>`;

      const field = root.querySelector('#vfield'), annot = root.querySelector('#annot');
      F.render(field, play, { names, subbed, viewBox: crop.viewBox });
      // The annotation layer covers the whole white canvas around the play (not the tools), in field
      // units: its viewBox is the play's crop box extended to the canvas edges, so marks stay glued
      // to the play when the layout changes.
      const fitAnnot = () => {
        const c = root.querySelector('#canvas'), fr = root.querySelector('.frame');
        if (!c || !fr || !annot.isConnected) return;
        const cr = c.getBoundingClientRect(), f = fr.getBoundingClientRect();
        if (!cr.width || !f.width) return;
        const k = G.FIELD_W / f.width;                        // field units per px
        const r = n => Math.round(n * 100) / 100;
        annot.setAttribute('viewBox', `${r(-(f.left - cr.left) * k)} ${r(crop.top - (f.top - cr.top) * k)} ${r(cr.width * k)} ${r(cr.height * k)}`);
      };
      fitAnnot();
      if (A.onResize) window.removeEventListener('resize', A.onResize);
      A.onResize = fitAnnot; window.addEventListener('resize', fitAnnot);
      drawAnnots(annot);
      const subBtn = root.querySelector('#subBtn'); if (subBtn) subBtn.onclick = () => subSheet(play);
      // notes are clamped to two lines so the whole view fits the screen without scrolling; tap for all of them
      const vn = root.querySelector('.vnotes'); if (vn) vn.onclick = () => {
        const m = FB.ui.modal(`<h2>${U.esc(play.name)}</h2><p style="white-space:pre-wrap;margin:0 0 14px">${U.esc(play.notes)}</p><div class="actions"><button type="button" class="btn primary" id="ok">Done</button></div>`, { focus: false });
        m.el.querySelector('#ok').onclick = m.close;
      };

      root.querySelector('#prevPlay').onclick = () => { location.hash = '#/view/' + prev.id; };
      root.querySelector('#nextPlay').onclick = () => { location.hash = '#/view/' + next.id; };
      root.querySelectorAll('[data-pen]').forEach(b => b.onclick = () => { A.pen = b.dataset.pen; root.querySelectorAll('[data-pen]').forEach(x => x.classList.toggle('on', x === b)); });
      root.querySelector('#undo').onclick = () => { A.strokes.pop(); drawAnnots(annot); };
      root.querySelector('#clear').onclick = () => { A.strokes = []; drawAnnots(annot); };
      root.querySelectorAll('[data-q]').forEach(b => b.onclick = () => S.setLineup({ quarter: +b.dataset.q }));

      // 🎥 opens the camera (iOS: straight into video mode). When the coach taps "Use Video" the file
      // lands here and FB.clips takes over: back to the playbook, clip saved underneath.
      const recBtn = root.querySelector('#recBtn'), recIn = root.querySelector('#recIn');
      recBtn.onclick = () => { recIn.value = ''; recIn.click(); };
      recIn.onchange = () => { const file = recIn.files && recIn.files[0]; recIn.value = ''; if (file) FB.clips.capture(file, play); };
      recIn.addEventListener('cancel', () => { recIn.value = ''; });

      // freehand drawing on the overlay (raw strokes, lightly thinned).
      // A plain tap on a player token (no drag) opens the substitution sheet instead of leaving a dot.
      let el = null, tapPos = null, tapAt = null, tapT = 0;
      annot.onpointerdown = e => {
        if (e.button != null && e.button !== 0) return;
        e.preventDefault();
        try { annot.setPointerCapture(e.pointerId); } catch (err) {}
        const p = pen();
        const [x, y] = F.pointFromEvent(annot, e);
        tapPos = L.show ? tokenAt(play, x, y) : null; tapAt = [x, y]; tapT = Date.now();
        A.live = { color: p.color, width: p.width, opacity: p.opacity, pts: [[x, y]] };
        el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        el.innerHTML = strokeMarkup(A.live);
        annot.appendChild(el);
      };
      annot.onpointermove = e => {
        if (!A.live) return;
        const [x, y] = F.pointFromEvent(annot, e);
        const last = A.live.pts[A.live.pts.length - 1];
        if (Math.hypot(x - last[0], y - last[1]) < 1.2) return;
        if (tapPos && Math.hypot(x - tapAt[0], y - tapAt[1]) > 6) tapPos = null;   // it's a drag: draw as usual
        A.live.pts.push([x, y]);                       // anywhere on the canvas, not just inside the play
        el.innerHTML = strokeMarkup(A.live);
      };
      const up = () => {
        if (!A.live) return;
        const wasTap = tapPos && Date.now() - tapT < 500;
        if (!wasTap) A.strokes.push(A.live);
        A.live = null; el = null; drawAnnots(annot);
        if (wasTap) { const pos = tapPos; tapPos = null; pickSheet(play, pos); }
        tapPos = null;
      };
      annot.onpointerup = up; annot.onpointercancel = () => { tapPos = null; up(); };

      // keyboard: arrows flip plays, Z undoes, Backspace clears
      document.onkeydown = e => {
        if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
        if (e.key === 'ArrowLeft') location.hash = '#/view/' + prev.id;
        else if (e.key === 'ArrowRight') location.hash = '#/view/' + next.id;
        else if (e.key === 'z' || e.key === 'Z') { A.strokes.pop(); drawAnnots(annot); }
        else if (e.key === 'Backspace') { A.strokes = []; drawAnnots(annot); }
      };
    },
    destroy() {
      document.body.classList.remove('viewing');
      document.onkeydown = null;
      if (A.onResize) { window.removeEventListener('resize', A.onResize); A.onResize = null; }
      A.playId = null; A.strokes = []; A.live = null;
    }
  };
})();

</script>
<script>
/* FlagBook — Film. Record straight from view mode (iOS opens the camera, the clip comes back to the
 * app), land on the playbook ready for the next play, and review clips per game with comments. */
(function () {
  'use strict';
  const FB = window.FB, U = FB.util, S = FB.store, M = FB.media;
  const C = {};
  const canShare = typeof navigator !== 'undefined' && !!navigator.share;

  function clipLabel(c) { return c.label || c.playName || 'Clip'; }
  function gameTitle(g) { return g.opponent ? 'vs ' + g.opponent : 'Game'; }
  function when(ms) { return ms ? new Date(ms).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''; }
  const coachName = () => (S.get().settings.coachName || '').trim();
  const byLabel = c => c.by || 'Coach';
  function commentHTML(c, clipId) {
    return `<div class="comment" data-comment="${c.id}"><div class="row spread"><span class="small"><b>${U.esc(byLabel(c))}</b> <span class="muted">· ${U.esc(when(c.at))}</span></span>${clipId ? '<button type="button" class="btn ghost sm" data-del-comment title="Delete comment">✕</button>' : ''}</div><div class="comment-text">${U.esc(c.text)}</div></div>`;
  }
  /* the textarea + name box used by both sheets */
  function commentForm(placeholder) {
    const name = coachName();
    return `<div class="field-row" style="margin-bottom:8px"><label>Comment</label><textarea id="ctext" placeholder="${U.esc(placeholder || 'What happened? Who made the play?')}" style="min-height:60px"></textarea></div>
      <div class="row" style="gap:8px;margin-bottom:12px"><input type="text" id="cby" placeholder="Your name" value="${U.esc(name)}" autocomplete="name" style="flex:1"><button type="button" class="btn" id="cpost">Post</button></div>`;
  }
  function detail(c) { return `${U.esc(c.playName)}${c.quarter ? ' · Q' + c.quarter : ''} · ${M.fmtDuration(c.durationMs) || '?:??'} · ${M.fmtBytes(c.sizeBytes)}`; }
  function fileFor(c, blob) {
    const base = (c.seq ? 'Play-' + String(c.seq).padStart(2, '0') + ' ' : '') + clipLabel(c).replace(/^Play \d+ · /, '');
    const name = base.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'clip';
    const type = c.mimeType || blob.type || 'video/quicktime';
    return new File([blob], name + M.extFor(type), { type });
  }
  /* iOS share sheet → "Save Video" puts it in Photos. Resolves false when cancelled/unavailable. */
  async function shareFile(file, title) {
    if (!canShare) { U.toast('Sharing is not available here'); return false; }
    try {
      if (navigator.canShare && !navigator.canShare({ files: [file] })) { U.toast('This browser cannot share video files'); return false; }
      await navigator.share({ files: [file], title: title || file.name });
      return true;
    } catch (e) { return false; }
  }
  /* Every clip of a game in one share sheet → "Save N Videos" puts them all in Photos. */
  async function shareAll(clips, title) {
    if (!canShare) return U.toast('Sharing is not available here');
    U.toast(`Preparing ${clips.length} clip${clips.length === 1 ? '' : 's'}…`, 60000);
    const files = [];
    for (const c of clips) { const blob = await M.get(c.id); if (blob) files.push(fileFor(c, blob)); }
    U.hideToast();
    if (!files.length) return U.toast('None of these clips are on this device');
    if (navigator.canShare && !navigator.canShare({ files })) return U.toast('This browser cannot share that many videos at once. Save them one at a time.');
    try { await navigator.share({ files, title }); U.toast(files.length < clips.length ? `Shared ${files.length} of ${clips.length} (the rest are not on this device)` : 'Sent to Photos / shared'); }
    catch (e) { /* cancelled */ }
  }
  function removeClip(id) {
    M.remove(id).catch(() => {});
    S.mutate(st => { st.videos = st.videos.filter(v => v.id !== id); });
  }
  const mediaCleanup = (m, url) => () => { const v = m && m.el && m.el.querySelector('video'); if (v) { try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) { /* ignore */ } } URL.revokeObjectURL(url); };

  /* ---------- from view mode: the camera just handed us a file ---------- */
  C.capture = async function (file, play) {
    if (!file) return;
    const L = S.get().lineup;
    const lineup = { show: L.show, gameId: L.gameId || '', quarter: L.quarter || null };
    const id = U.uid();
    FB.app.go('#/playbook');                       // back to the grid right away; the save finishes underneath
    U.toast('Saving clip…', 60000);
    const seq = S.nextClipSeq(lineup.gameId);
    const durationMs = await M.probeDuration(file);
    const meta = M.meta({ id, file, play, lineup, durationMs, seq });
    let stored = false, why = '';
    if (!M.available) why = location.protocol === 'file:' ? 'The single-file version cannot keep clips.' : 'This browser cannot store clips.';
    else if (file.size > M.MAX_KEEP_BYTES) why = 'This clip is too big to keep in FlagBook (' + M.fmtBytes(file.size) + ').';
    else {
      try { await M.put(id, file); stored = true; }
      catch (e) { why = e && e.name === 'QuotaExceededError' ? 'Not enough space on this device to keep it.' : 'Could not store the clip' + (e && e.message ? ': ' + e.message : '.'); }
    }
    if (stored) S.mutate(st => st.videos.push(meta));
    U.hideToast();
    captureSheet(meta, file, stored, why);
  };

  function captureSheet(meta, file, stored, why) {
    const url = URL.createObjectURL(file);
    let m = null;
    m = FB.ui.modal(`<h2>${stored ? '🎥 Clip saved' : '🎥 Clip not saved'}</h2>
      <video class="clip-video" src="${url}" playsinline controls muted preload="metadata"></video>
      <div class="small muted" style="margin:8px 0 12px">${detail(meta)}</div>
      ${stored ? `<div class="field-row"><label>Label</label><input type="text" id="clabel" value="${U.esc(meta.label)}"></div>
                  <div id="clist"></div>${commentForm()}`
               : `<p class="hint" style="margin:0 0 12px">${U.esc(why)} Save it to Photos so you keep it.</p>`}
      <div class="actions">${stored ? '<button type="button" class="btn danger" id="cdel">Delete</button>' : ''}${canShare ? `<button type="button" class="btn${stored ? '' : ' primary'}" id="cshare">Save to Photos</button>` : ''}<button type="button" class="btn${stored ? ' primary' : ''}" id="cdone">Done</button></div>`,
      { focus: false, onClose: () => mediaCleanup(m, url)() });
    const q = sel => m.el.querySelector(sel);
    q('#cdone').onclick = m.close;
    const share = q('#cshare'); if (share) share.onclick = async () => { if (await shareFile(file, meta.label)) U.toast('Sent to Photos / shared'); };
    const label = q('#clabel'); if (label) label.onchange = () => S.mutate(st => { const c = st.videos.find(v => v.id === meta.id); if (c) c.label = label.value.trim() || meta.label; });
    if (stored) bindComments(m, meta.id);
    const del = q('#cdel'); if (del) del.onclick = () => U.confirm('Delete this clip?', { ok: 'Delete', danger: true }).then(ok => { if (ok) { removeClip(meta.id); m.close(); U.toast('Clip deleted'); } });
  }

  /* ---------- comments (shared by the capture sheet and the clip sheet) ---------- */
  function bindComments(m, clipId) {
    const q = sel => m.el.querySelector(sel);
    const list = q('#clist'), text = q('#ctext'), by = q('#cby'), post = q('#cpost');
    const draw = () => {
      const v = S.get().videos.find(x => x.id === clipId); const cs = (v && v.comments) || [];
      list.innerHTML = cs.length ? `<div class="subhead">Comments · ${cs.length}</div>` + cs.map(c => commentHTML(c, clipId)).join('') : '';
      list.querySelectorAll('[data-del-comment]').forEach(b => b.onclick = () => U.confirm('Delete this comment?', { ok: 'Delete', danger: true }).then(ok => { if (ok) { S.removeClipComment(clipId, b.closest('[data-comment]').dataset.comment); draw(); } }));
    };
    const submit = () => {
      if (!text.value.trim()) return U.toast('Write a comment first');
      if (!by.value.trim()) { by.focus(); return U.toast('Add your name so the team knows who said it'); }
      S.addClipComment(clipId, text.value, by.value); text.value = ''; draw();
    };
    post.onclick = submit;
    text.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submit(); };
    draw();
  }

  /* ---------- label + comments sheet ---------- */
  function clipSheet(c) {
    const m = FB.ui.modal(`<h2>${U.esc(clipLabel(c))}</h2>
      <div class="small muted" style="margin:-8px 0 12px">${detail(c)}${c.createdAt ? ' · ' + U.esc(when(c.createdAt)) : ''}</div>
      <div class="field-row"><label>Label</label><input type="text" id="clabel" value="${U.esc(clipLabel(c))}"></div>
      <div id="clist"></div>${commentForm()}
      <div class="actions"><button type="button" class="btn primary" id="cdone">Done</button></div>`, { focus: false });
    m.el.querySelector('#cdone').onclick = m.close;
    m.el.querySelector('#clabel').onchange = e => S.mutate(st => { const v = st.videos.find(x => x.id === c.id); if (v) v.label = e.target.value.trim() || clipLabel(c); });
    bindComments(m, c.id);
  }

  /* ---------- playback ---------- */
  async function playClip(c) {
    const blob = await M.get(c.id);
    if (!blob) return U.toast('This clip is not on this device');
    const url = URL.createObjectURL(blob);
    let m = null;
    m = FB.ui.modal(`<h2>${U.esc(clipLabel(c))}</h2>
      <video class="clip-video" src="${url}" playsinline controls preload="metadata"></video>
      <div class="small muted" style="margin:8px 0 12px">${detail(c)}</div>
      <div class="actions">${canShare ? '<button type="button" class="btn" id="cshare">Save to Photos</button>' : ''}<button type="button" class="btn primary" id="cdone">Done</button></div>`,
      { focus: false, onClose: () => mediaCleanup(m, url)() });
    m.el.querySelector('#cdone').onclick = m.close;
    const share = m.el.querySelector('#cshare'); if (share) share.onclick = () => shareFile(fileFor(c, blob), clipLabel(c));
    const v = m.el.querySelector('video'); if (v) v.play().catch(() => {});
  }

  /* ---------- clips list: #/clips or #/clips?game=<id> ---------- */
  function rowHTML(c) {
    const cs = c.comments || [], last = cs[cs.length - 1];
    return `<div class="card clip-row tap" data-clip="${c.id}" title="Tap for comments">
      <div class="grow"><div class="card-title">${U.esc(clipLabel(c))}</div>
        <div class="small muted">${detail(c)}${c.createdAt ? ' · ' + U.esc(when(c.createdAt)) : ''}</div>
        ${last ? `<div class="small clip-notes">💬 ${cs.length > 1 ? cs.length + ' · ' : ''}<b>${U.esc(byLabel(last))}:</b> ${U.esc(last.text)}</div>` : `<div class="small muted clip-notes">💬 <i>Add a comment</i></div>`}
        <div class="small missing-note hidden" style="color:var(--red)">Not on this device</div></div>
      <div class="row" style="gap:6px"><button class="btn icon" data-play title="Play">▶</button>${canShare ? '<button class="btn icon" data-share title="Save to Photos / share">⤴</button>' : ''}<button class="btn icon danger" data-del title="Delete">🗑</button></div>
    </div>`;
  }

  const FOOT = `<p class="small muted" style="text-align:center;margin-top:16px">Film stays on this device and is not in the JSON backup (comments are). Use Save to Photos for a permanent copy.<span id="mediaUse"></span></p>`;
  const showUsage = root => M.usage().then(u => { const el = root.querySelector('#mediaUse'); if (el && u && u.usage) el.textContent = ` Using ${M.fmtBytes(u.usage)}${u.quota ? ' of ' + M.fmtBytes(u.quota) : ''}.`; });
  const bySeq = (a, b) => (+a.seq || 0) - (+b.seq || 0) || (a.createdAt || 0) - (b.createdAt || 0);   // Play 1, 2, 3… within a game
  const groupKey = c => (c.gameId && S.game(c.gameId) ? c.gameId : 'none');

  /* #/film → one card per game; #/film?game=<id|none> → that game's clips */
  FB.views.clips = {
    render(root, route) {
      const st = S.get();
      const gid = (route.query && route.query.game) || '';
      if (gid) return renderGame(root, st, gid);
      FB.ui.setTitle(`<h1>Film</h1>`);
      if (!st.videos.length) {
        root.innerHTML = `<div class="empty">No film yet.<br><br><span class="small">Open a play in the <a href="#/playbook">playbook</a> and tap <b>🎥</b> to record a clip. When you stop, you land back on the playbook.</span></div>`;
        return;
      }
      const groups = new Map();                      // most recent game first
      for (const c of st.videos.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))) { const k = groupKey(c); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); }
      let html = '';
      for (const [k, list] of groups) {
        const gg = k !== 'none' ? S.game(k) : null;
        const ms = list.reduce((t, c) => t + (c.durationMs || 0), 0), bytes = list.reduce((t, c) => t + (c.sizeBytes || 0), 0);
        const comments = list.reduce((t, c) => t + ((c.comments || []).length), 0);
        html += `<a class="card tap" href="#/film?game=${k}" style="display:block;text-decoration:none">
          <div class="row spread"><div class="card-title">🎬 ${gg ? U.esc(gameTitle(gg)) : 'Other clips'}</div><div class="muted">${gg ? U.fmtDate(gg.date) : ''}</div></div>
          <div class="row wrap small muted" style="margin-top:6px;gap:12px"><span>${list.length} clip${list.length === 1 ? '' : 's'}</span>${ms ? `<span>${M.fmtDuration(ms)}</span>` : ''}<span>${M.fmtBytes(bytes)}</span>${comments ? `<span>💬 ${comments}</span>` : ''}</div></a>`;
      }
      root.innerHTML = html + FOOT;
      showUsage(root);
    }
  };

  function renderGame(root, st, gid) {
    const g = gid !== 'none' ? S.game(gid) : null;
    FB.ui.setTitle(`<a class="btn ghost sm" href="#/film" aria-label="All film">‹</a><h1>${g ? U.esc(gameTitle(g)) + ' · film' : 'Other clips'}</h1>${g ? `<a class="btn sm" href="#/games/${g.id}">Game</a>` : ''}`);
    const clips = st.videos.filter(c => groupKey(c) === gid).sort(bySeq);
    if (!clips.length) {
      root.innerHTML = `<div class="empty">No film for this game yet.<br><br><span class="small">Pick this game in the playbook's lineup bar, open a play and tap <b>🎥</b>.</span></div>`;
      return;
    }
    root.innerHTML = `<div class="section" style="margin-top:0"><div class="row spread"><h3>${g ? U.fmtDate(g.date) + ' · ' : ''}${clips.length} clip${clips.length === 1 ? '' : 's'}</h3>${canShare ? `<button class="btn sm" id="shareAll" title="Every clip of this game in one share sheet → Save Video">⤴ Save all to Photos</button>` : ''}</div>${clips.map(rowHTML).join('')}</div>${FOOT}`;
    const sa = root.querySelector('#shareAll'); if (sa) sa.onclick = () => shareAll(clips, g ? gameTitle(g) + ' clips' : 'FlagBook clips');
    root.querySelectorAll('[data-clip]').forEach(el => {
        const c = st.videos.find(v => v.id === el.dataset.clip); if (!c) return;
        el.onclick = e => { if (!e.target.closest('button, a')) clipSheet(c); };
        el.querySelector('[data-play]').onclick = () => playClip(c);
        const sh = el.querySelector('[data-share]'); if (sh) sh.onclick = async () => { const blob = await M.get(c.id); if (!blob) return U.toast('This clip is not on this device'); shareFile(fileFor(c, blob), clipLabel(c)); };
        el.querySelector('[data-del]').onclick = () => U.confirm('Delete this clip?', { ok: 'Delete', danger: true }).then(ok => { if (ok) { removeClip(c.id); U.toast('Clip deleted'); } });
        M.has(c.id).then(ok => {
          if (ok || !el.isConnected) return;
          el.querySelector('.missing-note').classList.remove('hidden');
          el.querySelector('[data-play]').disabled = true;
          if (sh) sh.disabled = true;
        });
    });
    showUsage(root);
  }

  FB.clips = C;
})();

</script>
<script>
(function () {
  'use strict';
  const FB = window.FB, U = FB.util, S = FB.store;

  FB.views.print = {
    className: 'editor',
    render(root, route) {
      const st = S.get();
      const plays = route.id ? [S.play(route.id)].filter(Boolean) : st.plays;
      const Q = st.settings.quarters || 4;
      const showTitles = route.query.titles !== '0';
      const allQ = route.query.quarters === 'all' && st.lineup.show;
      const names = S.lineupNames();
      const label = S.lineupLabel();

      // one sheet per play, or one per play per quarter when printing all quarters
      const sheets = [];
      if (allQ) {
        const saved = st.lineup.quarter;
        for (let q = 1; q <= Q; q++) {
          st.lineup.quarter = q;
          const n = S.lineupNames(), l = S.lineupLabel();
          for (const p of plays) sheets.push({ p, names: n, label: l });
        }
        st.lineup.quarter = saved;
      } else for (const p of plays) sheets.push({ p, names, label });

      FB.ui.setTitle(`<a class="btn ghost sm" href="${route.id ? '#/playbook/' + route.id : '#/playbook'}">‹ Back</a><h1>Print playbook</h1>`);
      root.innerHTML = `<div class="print-bar"><div class="row wrap"><label class="switch"><input type="checkbox" id="titles"${showTitles ? ' checked' : ''}> Play names</label>
          ${st.lineup.show ? `<label class="switch"><input type="checkbox" id="allq"${allQ ? ' checked' : ''}> All ${Q} quarters</label>` : ''}
          <span class="small muted">${sheets.length} page${sheets.length === 1 ? '' : 's'} · ${label ? U.esc(label) + ' · ' : ''}10in × 7.5in</span></div>
          <button class="btn primary" id="print">🖨 Print / Save PDF</button></div>
        <div class="print-pages" style="padding:14px">${sheets.map(s => `<div class="sheet">${FB.field.svgString(s.p, { names: s.names })}${showTitles ? `<div class="title">${U.esc(s.p.name)}</div>` : ''}${s.label ? `<div class="names">${U.esc(s.label)}</div>` : ''}</div>`).join('')}</div>`;
      root.querySelector('#print').onclick = () => window.print();
      const setQuery = patch => {
        const q = Object.assign({}, route.query, patch);
        location.hash = route.path + '?' + Object.keys(q).filter(k => q[k] !== '').map(k => k + '=' + encodeURIComponent(q[k])).join('&');
      };
      root.querySelector('#titles').onchange = e => setQuery({ titles: e.target.checked ? '1' : '0' });
      const allq = root.querySelector('#allq'); if (allq) allq.onchange = e => setQuery({ quarters: e.target.checked ? 'all' : '' });
    }
  };
})();

</script>
<script>
(function () {
  'use strict';
  const FB = window.FB, U = FB.util, S = FB.store;

  FB.views.settings = {
    render(root) {
      const st = S.get();
      FB.ui.setTitle('<h1>More</h1>');
      const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
      root.innerHTML = `
        <div class="card"><h2 style="margin-bottom:10px">Team</h2>
          <div class="two"><div class="field-row"><label>Team name</label><input type="text" id="tname" value="${U.esc(st.team.name)}"></div>
          <div class="field-row"><label>Season</label><input type="text" id="tseason" value="${U.esc(st.team.season)}" placeholder="Fall 2026"></div></div>
          <div class="field-row"><label>Your name <span class="muted" style="text-transform:none;letter-spacing:0">(signs your film comments)</span></label><input type="text" id="coach" value="${U.esc(st.settings.coachName || '')}" placeholder="Coach Ray" autocomplete="name"></div>
          <div class="field-row"><label>Quarters per game</label><select id="quarters">${[2, 4].map(n => `<option value="${n}"${(st.settings.quarters || 4) === n ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
        </div>
        <div class="card"><h2 style="margin-bottom:10px">Backup & sharing</h2>
          <p class="small muted">Everything is stored on this device. Export a backup file regularly, or send it to an assistant coach who can import it.</p>
          <div class="row wrap"><button class="btn primary" id="export">⬇︎ Export backup</button>${navigator.share ? '<button class="btn" id="share">Share…</button>' : ''}<label class="btn">⬆︎ Import<input type="file" id="import" accept="application/json,.json" class="hidden"></label></div>
        </div>
        <div class="card"><h2 style="margin-bottom:10px">Playbook</h2>
          <div class="row wrap"><a class="btn" href="#/print">🖨 Print all plays</a><button class="btn" id="seed">Restore sample Raiders plays</button></div>
        </div>
        <div class="card"><h2 style="margin-bottom:10px">Install on your phone</h2>
          ${standalone ? '<p class="small">✅ Installed. Works offline.</p>'
            : location.protocol === 'file:' ? `<p class="small muted">You are running the single-file version${S.storageOK === false ? ', and this viewer <b>does not keep saved data</b>' : ''}. For a home-screen app that saves and works offline, open the hosted version in Safari and choose <b>Add to Home Screen</b>.</p>`
            : `<p class="small muted">iPhone/iPad: tap the Share button in Safari, then <b>Add to Home Screen</b>. Android: menu → <b>Install app</b>. The app then works offline on the field.</p>`}
        </div>
        <div class="card"><h2 style="margin-bottom:10px">Danger zone</h2><button class="btn danger" id="reset">Erase everything</button></div>
        <p class="small muted" style="text-align:center;margin-top:16px">FlagBook · data stays on this device</p>`;
      root.querySelector('#tname').onchange = e => S.mutate(s => s.team.name = e.target.value.trim());
      root.querySelector('#tseason').onchange = e => S.mutate(s => s.team.season = e.target.value.trim());
      root.querySelector('#quarters').onchange = e => S.mutate(s => s.settings.quarters = +e.target.value);
      root.querySelector('#coach').onchange = e => S.mutate(s => s.settings.coachName = e.target.value.trim());
      root.querySelector('#export').onclick = () => U.download(`flagbook-${(st.team.name || 'team').replace(/\W+/g, '-')}-${U.todayISO()}.json`, S.exportJSON());
      const share = root.querySelector('#share');
      if (share) share.onclick = async () => {
        try {
          const file = new File([S.exportJSON()], `flagbook-${U.todayISO()}.json`, { type: 'application/json' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'FlagBook backup' });
          else await navigator.share({ title: 'FlagBook backup', text: S.exportJSON() });
        } catch (e) { /* cancelled */ }
      };
      root.querySelector('#import').onchange = e => {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          U.confirm('Import this backup.\n\nReplace everything with the file, or merge it into the data already here?', { ok: 'Replace', cancel: 'Merge', danger: true }).then(replace => {
            try { S.importJSON(r.result, replace ? 'replace' : 'merge'); U.toast('Imported'); } catch (err) { U.toast('Could not import: ' + err.message, 4000); }
          });
        };
        r.readAsText(f);
      };
      root.querySelector('#seed').onclick = () => { S.resetSeedPlays(); U.toast('Sample plays added'); };
      root.querySelector('#reset').onclick = () => U.confirm('Erase roster, schedule, games, plays and clips on this device?', { ok: 'Erase', danger: true })
        .then(ok => ok && U.confirm('Really erase everything? Export a backup first if unsure.', { ok: 'Erase everything', danger: true }))
        .then(ok => { if (ok) { FB.media.clear().catch(() => {}); S.reset(); U.toast('Erased'); } });
    }
  };
})();

</script>
<script>
/* FlagBook — router, shared UI helpers, boot. */
(function () {
  'use strict';
  const FB = (window.FB = window.FB || {});
  const U = FB.util, S = FB.store;
  FB.views = FB.views || {};

  /* ---------- UI helpers ---------- */
  const UI = {};
  UI.modal = function (html, opts) {
    opts = opts || {};
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal" role="dialog">' + html + '</div>';
    document.body.appendChild(bg);
    const close = () => { if (bg.parentNode) bg.parentNode.removeChild(bg); if (opts.onClose) opts.onClose(); };
    bg.addEventListener('click', e => { if (e.target === bg && !opts.sticky) close(); });
    const first = bg.querySelector('input:not([type=hidden]), select, textarea');
    if (first && opts.focus !== false) setTimeout(() => first.focus(), 50);
    return { el: bg.firstElementChild, bg, close };
  };
  UI.formData = function (form) {
    const o = {};
    for (const el of form.elements) {
      if (!el.name) continue;
      if (el.type === 'checkbox') {
        if (el.name.endsWith('[]')) { const k = el.name.slice(0, -2); (o[k] = o[k] || []); if (el.checked) o[k].push(el.value); }
        else o[el.name] = el.checked;
      } else o[el.name] = el.value.trim ? el.value.trim() : el.value;
    }
    return o;
  };
  UI.posChip = function (pos) {
    const m = S.POSITION_META[pos];
    return `<span class="chip pos" style="background:${m.fill};${pos === 'Z' ? 'color:#5b4a00' : ''}">${pos}</span>`;
  };
  UI.playerOptions = function (selectedId, includeBlank) {
    let s = includeBlank ? '<option value="">—</option>' : '';
    for (const p of S.activeRoster()) s += `<option value="${p.id}"${p.id === selectedId ? ' selected' : ''}>${p.number ? '#' + U.esc(p.number) + ' ' : ''}${U.esc(p.name)}</option>`;
    return s;
  };
  UI.setTitle = function (html) { document.getElementById('topbar').innerHTML = '<div class="topbar-in">' + html + '</div>'; };
  FB.ui = UI;

  /* ---------- router ---------- */
  const ROUTES = [
    [/^#?\/?$/, 'home'], [/^#\/home/, 'home'], [/^#\/roster/, 'roster'], [/^#\/practices/, 'practices'],
    [/^#\/games\/([^/?]+)/, 'game', 'games'], [/^#\/games/, 'games'],
    [/^#\/playbook\/([^/?]+)/, 'playbook', 'playbook'], [/^#\/playbook/, 'playbook'],
    [/^#\/view\/([^/?]+)/, 'viewer', 'playbook'],
    [/^#\/print(?:\/([^/?]+))?/, 'print', 'playbook'], [/^#\/gamesheet\/([^/?]+)/, 'gamesheet', 'games'],
    [/^#\/film/, 'clips', 'film'], [/^#\/clips/, 'clips', 'film'],
    [/^#\/settings/, 'settings']
  ];
  let current = null;

  function parse() {
    const hash = location.hash || '#/home';
    const [path, qs] = hash.split('?');
    const query = {};
    if (qs) for (const kv of qs.split('&')) { const [k, v] = kv.split('='); query[decodeURIComponent(k)] = decodeURIComponent(v || ''); }
    for (const r of ROUTES) {
      const m = r[0].exec(path);
      if (m) return { view: r[1], nav: r[2] || r[1], id: m[1] ? decodeURIComponent(m[1]) : null, query, path };
    }
    return { view: 'home', nav: 'home', id: null, query, path };
  }

  function render() {
    const route = parse();
    const view = FB.views[route.view];
    const root = document.getElementById('app');
    if (current && current.view !== route.view && FB.views[current.view] && FB.views[current.view].destroy) FB.views[current.view].destroy();
    current = route;
    root.className = 'page' + (view && view.className ? ' ' + view.className : '');
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.nav === route.nav));
    if (!view) { root.innerHTML = '<div class="empty">Not found</div>'; return; }
    try { view.render(root, route); } catch (e) { console.error(e); root.innerHTML = '<div class="empty">Something went wrong: ' + U.esc(e.message) + '</div>'; }
  }

  FB.app = {
    go(hash) { if (location.hash === hash) render(); else location.hash = hash; },
    rerender: render,
    route: () => current
  };

  window.addEventListener('hashchange', render);
  S.subscribe(() => { const v = FB.views[current && current.view]; if (v && !v.selfManaged) render(); });

  document.addEventListener('DOMContentLoaded', () => {
    S.load();
    render();
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  });
})();

</script>
